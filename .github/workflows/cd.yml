name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brewlite_test
          POSTGRES_USER: brewlite_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite_test -d brewlite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Install API
        working-directory: apps/api
        run: npm ci
      - name: API lint
        working-directory: apps/api
        run: npm run lint
      - name: API unit tests
        working-directory: apps/api
        run: npm run test -- --runInBand
      - name: PostgreSQL integration tests
        working-directory: apps/api
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://brewlite_test@127.0.0.1:5432/brewlite_test
      - name: PostgreSQL E2E tests
        working-directory: apps/api
        run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://brewlite_test@127.0.0.1:5432/brewlite_test
      - name: API build
        working-directory: apps/api
        run: npm run build
      - name: Install web
        working-directory: apps/web
        run: npm ci
      - name: Web lint
        working-directory: apps/web
        run: npm run lint
      - name: Web build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4174
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        working-directory: apps/web
        run: npm run test:e2e

  deploy:
    name: Deploy to Render and Vercel
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate provider configuration
        run: |
          set -euo pipefail
          for name in API_URL WEB_URL RENDER_SERVICE_ID RENDER_API_KEY VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing production configuration: $name"
              exit 1
            fi
          done
          if [[ ! "$API_URL" =~ ^https://[A-Za-z0-9.-]+$ || ! "$WEB_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::API_URL and WEB_URL must be HTTPS origins without a trailing slash."
            exit 1
          fi
          if [[ ! "$RENDER_SERVICE_ID" =~ ^srv-[A-Za-z0-9-]+$ ]]; then
            echo "::error::RENDER_SERVICE_ID must be a Render service ID."
            exit 1
          fi
          if [[ ! "$VERCEL_ORG_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::VERCEL_ORG_ID must be the Vercel account or team ID that owns the project."
            exit 1
          fi
          if [[ ! "$VERCEL_PROJECT_ID" =~ ^prj_[A-Za-z0-9]+$ ]]; then
            echo "::error::VERCEL_PROJECT_ID must be the Vercel project ID (prj_...), not an account or team ID."
            exit 1
          fi
      - name: Capture current Render release
        id: previous-render
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20&status=live")"
          deploy_id="$(jq -er '[.[] | .deploy | select(.status == "live")] | sort_by(.createdAt) | last | .id // empty' <<< "$response")"
          if [[ -z "$deploy_id" ]]; then
            echo "::error::No prior live Render deployment was found; deploy once and verify it before enabling automated rollback."
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
      - name: Deploy API to Render
        id: deploy-render
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --request POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"commitId\":\"$GITHUB_SHA\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          deploy_id="$(jq -er '.id' <<< "$response")"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 90); do
            deploy="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")"
            status="$(jq -er '.status' <<< "$deploy")"
            echo "Render deployment status: $status"
            case "$status" in
              live)
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deployment finished with status: $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Render deployment did not become live within 15 minutes."
          exit 1
      - name: Smoke test Render API
        run: |
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-all-errors \
            --retry-delay 5 --max-time 15 "$API_URL/health" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors \
            --retry-delay 3 --max-time 15 "$API_URL/products" > /dev/null
      - name: Deploy web to Vercel
        id: deploy-web
        working-directory: apps/web
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@65.16.0 deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Public HTTPS smoke test
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-all-errors --retry-delay 2 "$WEB_URL/" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 2 "$WEB_URL/manifest.webmanifest" > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-all-errors --retry-delay 2 "$API_URL/health" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 2 "$API_URL/products" > /dev/null
          response_headers="$(mktemp)"
          trap 'rm -f "$response_headers"' EXIT
          curl --fail --silent --show-error --request OPTIONS \
            -H "Origin: $WEB_URL" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type,idempotency-key" \
            -D "$response_headers" -o /dev/null "$API_URL/orders"
          grep --ignore-case --fixed-strings "access-control-allow-origin: $WEB_URL" "$response_headers" > /dev/null
          grep --ignore-case "access-control-allow-methods:.*POST" "$response_headers" > /dev/null
          grep --ignore-case "access-control-allow-headers:.*authorization.*idempotency-key" "$response_headers" > /dev/null
      - name: Roll back failed production release
        if: failure() && steps.deploy-render.outputs.deploy_id != ''
        env:
          PREVIOUS_RENDER_DEPLOY_ID: ${{ steps.previous-render.outputs.deploy_id }}
          RENDER_DEPLOY_ID: ${{ steps.deploy-render.outputs.deploy_id }}
          VERCEL_DEPLOY_SUCCEEDED: ${{ steps.deploy-web.outcome == 'success' }}
        run: |
          set -u
          rollback_failed=0

          if [[ "$VERCEL_DEPLOY_SUCCEEDED" == "true" ]]; then
            if ! (cd apps/web && npx --yes vercel@65.16.0 rollback --non-interactive --token "$VERCEL_TOKEN"); then
              echo "::error::Vercel rollback failed; restore the previous production deployment from the Vercel dashboard."
              rollback_failed=1
            fi
          fi

          current="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID")" || {
              echo "::error::Could not inspect the Render deployment during rollback."
              exit 1
            }
          current_status="$(jq -r '.status // empty' <<< "$current")"
          if [[ "$current_status" == "live" ]]; then
            if [[ -z "$PREVIOUS_RENDER_DEPLOY_ID" ]]; then
              echo "::error::No previous Render deployment ID is available for rollback."
              rollback_failed=1
            else
              rollback="$(curl --fail-with-body --silent --show-error --request POST \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -H "Content-Type: application/json" \
                --data "{\"deployId\":\"$PREVIOUS_RENDER_DEPLOY_ID\"}" \
                "https://api.render.com/v1/services/$RENDER_SERVICE_ID/rollback")" || {
                  echo "::error::Render rollback request failed."
                  rollback_failed=1
                  rollback=''
                }
              if [[ -n "$rollback" ]]; then
                rollback_id="$(jq -er '.id' <<< "$rollback")" || {
                  echo "::error::Render rollback response did not contain a deployment ID."
                  rollback_failed=1
                  rollback_id=''
                }
                if [[ -n "$rollback_id" ]]; then
                  rollback_live=false
                  for _ in $(seq 1 90); do
                    rollback_status="$(curl --fail-with-body --silent --show-error \
                      -H "Authorization: Bearer $RENDER_API_KEY" \
                      "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$rollback_id" |
                      jq -er '.status')"
                    if [[ "$rollback_status" == "live" ]]; then
                      rollback_live=true
                      break
                    fi
                    if [[ "$rollback_status" == "build_failed" || "$rollback_status" == "update_failed" || "$rollback_status" == "pre_deploy_failed" || "$rollback_status" == "canceled" ]]; then
                      break
                    fi
                    sleep 10
                  done
                  if [[ "$rollback_live" != "true" ]]; then
                    echo "::error::Render rollback did not become live; inspect the Render deployment."
                    rollback_failed=1
                  fi
                fi
              fi
            fi
          else
            echo "Render deployment status is '$current_status'; no Render rollback is needed."
          fi

          if [[ "$rollback_failed" -ne 0 ]]; then
            exit 1
          fi
