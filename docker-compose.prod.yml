x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 3001
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production .env file}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the production .env file}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
  CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in the production .env file}
  DB_LOGGING: "false"
  MOCK_PAYMENT_RESULT: ${MOCK_PAYMENT_RESULT:-success}
  MOCK_PAYMENT_TIMEOUT: ${MOCK_PAYMENT_TIMEOUT:-false}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the production .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production .env file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the production .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    image: ghcr.io/nguyentriet2k69-lang/brew-lite2-api:${RELEASE_SHA:?Set RELEASE_SHA to a commit SHA}
    environment: *api-environment
    networks:
      - edge
      - data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    image: ghcr.io/nguyentriet2k69-lang/brew-lite2-web:${RELEASE_SHA:?Set RELEASE_SHA to a commit SHA}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in the production .env file}
      API_INTERNAL_URL: http://api:3001
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN in the production .env file}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in the production .env file}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: ghcr.io/nguyentriet2k69-lang/brew-lite2-api:${RELEASE_SHA:?Set RELEASE_SHA to a commit SHA}
    profiles:
      - release
    environment: *api-environment
    command: ["node", "dist/run-migrations.js"]
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: ghcr.io/nguyentriet2k69-lang/brew-lite2-api:${RELEASE_SHA:?Set RELEASE_SHA to a commit SHA}
    profiles:
      - release
    environment: *api-environment
    command: ["node", "dist/seed.js"]
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
